<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Differential Equations Flashcards</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; background-color: #f4f4f9; }
        .card { border: 2px solid #333; padding: 25px; margin: 20px auto; max-width: 550px; background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button, select { padding: 10px 18px; margin: 5px; font-size: 15px; border-radius: 5px; cursor: pointer; }
        select { background: white; border: 1px solid #ccc; }
        #answer { color: #2e7d32; font-weight: bold; display: none; margin-top: 15px; }
        #card-tracker { font-size: 14px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Differential Equations Reviewer</h1>
    
    <div>
        <label for="termSelect"><strong>Select Term:</strong></label>
        <select id="termSelect" onchange="onTermChange()">
            <option value="prelim">Prelim</option>
            <option value="midterm">Midterm</option>
            <option value="finals">Finals</option>
        </select>

        <label for="topicSelect"><strong>Select Topic:</strong></label>
        <select id="topicSelect" onchange="onTopicChange()">
            <!-- Populated dynamically -->
        </select>
    </div>

    <div class="card">
        <div id="card-tracker">Card 0 of 0</div>
        <h3 id="question">Loading WebAssembly...</h3>
        <p id="answer"></p>
        <button onclick="revealAnswer()">Reveal Answer</button>
        <button onclick="nextCard()">Next Card</button>
    </div>

    <script src="deck.js"></script>
    <script>
        let reviewer = null;

        Module.onRuntimeInitialized = () => {
            reviewer = new Module.DiffEqReviewer();
            onTermChange();
        };

        function onTermChange() {
            if (!reviewer) return;
            const term = document.getElementById('termSelect').value;
            const topicSelect = document.getElementById('topicSelect');
            topicSelect.innerHTML = '';

            const count = reviewer.getTopicCount(term);
            
            // Add "All Topics" option first
            let allOpt = document.createElement('option');
            allOpt.value = "-1";
            allOpt.innerText = "All Topics";
            topicSelect.appendChild(allOpt);

            // Add individual topics
            for (let i = 0; i < count; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = reviewer.getTopicName(term, i);
                topicSelect.appendChild(opt);
            }

            onTopicChange();
        }

        function onTopicChange() {
            if (!reviewer) return;
            const term = document.getElementById('termSelect').value;
            const topicIdx = parseInt(document.getElementById('topicSelect').value);
            
            reviewer.loadTopic(term, topicIdx);
            updateCardDisplay();
        }

        function revealAnswer() {
            if (!reviewer) return;
            document.getElementById('answer').style.display = 'block';
        }

        function nextCard() {
            if (!reviewer) return;
            reviewer.nextCard();
            updateCardDisplay();
        }

        function updateCardDisplay() {
            document.getElementById('question').innerText = reviewer.getQuestion();
            document.getElementById('answer').innerText = reviewer.getAnswer();
            document.getElementById('answer').style.display = 'none';

            const idx = reviewer.getCardIndex();
            const total = reviewer.getTotalCards();
            document.getElementById('card-tracker').innerText = total > 0 ? `Card ${idx} of ${total}` : 'No cards available';
        }
    </script>
</body>
</html>
