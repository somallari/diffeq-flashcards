<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiffEq Reviewer | Flashcards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --accent-hover: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        /* Screen Toggle */
        .screen {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header & Badges */
        .badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* Welcome Page Term Cards */
        .section-label {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-align: left;
        }

        .term-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .term-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            padding: 18px 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-weight: 700;
            color: var(--text-muted);
        }

        .term-card:hover {
            border-color: #6366f1;
            color: var(--text-main);
            transform: translateY(-2px);
        }

        .term-card.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: #6366f1;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        /* Select Dropdown */
        .select-group {
            margin-bottom: 30px;
            text-align: left;
        }

        select {
            width: 100%;
            padding: 14px 16px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            color: var(--text-main);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        select:focus {
            border-color: #6366f1;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            color: white;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            border-color: #6366f1;
            color: #a5b4fc;
        }

        /* Flashcard Interface */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: var(--card-border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-gradient);
            transition: width 0.3s ease;
        }

        .flashcard {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 35px 25px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 25px;
            position: relative;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 20px;
        }

        .answer-box {
            display: none;
            width: 100%;
            padding: 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            color: #34d399;
            font-weight: 600;
            text-align: center;
            font-size: 1.05rem;
            animation: fadeIn 0.25s ease;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.75rem; }
            .term-grid { grid-template-columns: 1fr; }
            .action-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- WELCOME SCREEN -->
        <div id="welcome-screen" class="screen active">
            <div style="text-align: center;">
                <span class="badge">WebAssembly Powered • C++</span>
                <h1>Differential Equations</h1>
                <p class="subtitle">Master ODEs, Laplace Transforms, Exact Equations & Systems with interactive reviewer flashcards.</p>
            </div>

            <div class="section-label">1. Choose Grading Period</div>
            <div class="term-grid">
                <div class="term-card selected" onclick="selectTerm('prelim', this)">Prelim</div>
                <div class="term-card" onclick="selectTerm('midterm', this)">Midterm</div>
                <div class="term-card" onclick="selectTerm('finals', this)">Finals</div>
            </div>

            <div class="section-label">2. Select Specific Topic</div>
            <div class="select-group">
                <select id="topicSelect">
                    <!-- Populated via C++ -->
                </select>
            </div>

            <button class="btn-primary" onclick="startPractice()">Start Reviewing →</button>
        </div>

        <!-- FLASHCARD APP SCREEN -->
        <div id="app-screen" class="screen">
            <div class="top-bar">
                <button class="btn-secondary" onclick="backToHome()">← Back to Menu</button>
                <span id="card-badge" class="badge" style="margin: 0;">Card 1 of 10</span>
            </div>

            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div class="flashcard">
                <div id="question" class="question-text">Loading WebAssembly engine...</div>
                <div id="answer" class="answer-box"></div>
            </div>

            <div class="action-row">
                <button class="btn-secondary" onclick="revealAnswer()">Show Answer</button>
                <button class="btn-primary" onclick="nextCard()">Next Question →</button>
            </div>
        </div>
    </div>

    <script src="deck.js"></script>
    <script>
        let reviewer = null;
        let selectedTerm = 'prelim';

        Module.onRuntimeInitialized = () => {
            reviewer = new Module.DiffEqReviewer();
            populateTopics('prelim');
        };

        function selectTerm(term, element) {
            selectedTerm = term;
            document.querySelectorAll('.term-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            populateTopics(term);
        }

        function populateTopics(term) {
            if (!reviewer) return;
            const topicSelect = document.getElementById('topicSelect');
            topicSelect.innerHTML = '';

            const count = reviewer.getTopicCount(term);
            
            let allOpt = document.createElement('option');
            allOpt.value = "-1";
            allOpt.innerText = "All Topics (Combined)";
            topicSelect.appendChild(allOpt);

            for (let i = 0; i < count; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = reviewer.getTopicName(term, i);
                topicSelect.appendChild(opt);
            }
        }

        function startPractice() {
            if (!reviewer) return;
            const topicIdx = parseInt(document.getElementById('topicSelect').value);
            reviewer.loadTopic(selectedTerm, topicIdx);

            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('app-screen').classList.add('active');
            
            updateCardDisplay();
        }

        function backToHome() {
            document.getElementById('app-screen').classList.remove('active');
            document.getElementById('welcome-screen').classList.add('active');
        }

        function revealAnswer() {
            if (!reviewer) return;
            document.getElementById('answer').style.display = 'block';
        }

        function nextCard() {
            if (!reviewer) return;
            reviewer.nextCard();
            updateCardDisplay();
        }

        function updateCardDisplay() {
            document.getElementById('question').innerText = reviewer.getQuestion();
            document.getElementById('answer').innerText = reviewer.getAnswer();
            document.getElementById('answer').style.display = 'none';

            const idx = reviewer.getCardIndex();
            const total = reviewer.getTotalCards();
            
            document.getElementById('card-badge').innerText = total > 0 ? `Card ${idx} of ${total}` : 'No cards';
            
            const progressPercent = total > 0 ? (idx / total) * 100 : 0;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
        }
    </script>
</body>
</html>
